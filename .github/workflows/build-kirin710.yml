name: Build APK Kirin 710

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar NDK 27
        run: |
          echo "y" | sdkmanager "ndk;27.2.12479018" --sdk_root=$ANDROID_SDK_ROOT
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Instalar dependencias npm
        run: npm ci

      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Verificar parche Kirin 710
        run: |
          if grep -q "__KIRIN710_INJECTED__" node_modules/cui-llama.rn/android/CMakeLists.txt; then
            echo "✓ Parche Kirin 710 aplicado"
          else
            echo "⚠ Parche NO encontrado"
          fi

      - name: Hacer ejecutable gradlew
        run: chmod +x android/gradlew

      - name: Build APK Release
        run: |
          cd android
          ./gradlew assembleRelease \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m" \
            -Dorg.gradle.parallel=true \
            -Dorg.gradle.caching=true
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Encontrar APK
        id: find_apk
        run: |
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "APK: $APK ($(du -sh $APK | cut -f1))"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatterUI-Kirin710-${{ github.run_number }}
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30
